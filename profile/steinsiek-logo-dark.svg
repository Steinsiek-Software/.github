<svg xmlns="http://www.w3.org/2000/svg" xml:lang="de" lang="de" viewBox="0 0 1738 352" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="sk-title sk-desc">
  <title id="sk-title">Steinsiek</title>
  <desc id="sk-desc">Das SK-Monogramm zeichnet sich selbst, faltet sich auseinander zum ersten und letzten Buchstaben, und die uebrigen Buchstaben der Wortmarke Steinsiek zeichnen sich im Sog der Bewegung von innen nach aussen.</desc>

  <style>
    .stroke   { fill: none; stroke-width: 56; stroke-linecap: round; }
    .struct   { stroke: #673AB7; }
    .diagonal { stroke: #7C4DFF; }

    .draw {
      stroke-dasharray: 1;
      stroke-dashoffset: 0;
      animation-name: draw;
      animation-fill-mode: both;
    }
    @keyframes draw {
      0%   { stroke-dashoffset: 1; opacity: 0; }
      1%   { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }

    #s-top    { animation-duration: .85s; animation-timing-function: cubic-bezier(.37,0,.63,1); animation-delay: .05s; }
    #s-bot    { animation-duration: .85s; animation-timing-function: cubic-bezier(.37,0,.63,1); animation-delay: .18s; }
    #k-stem   { animation-duration: .62s; animation-timing-function: cubic-bezier(.33,1,.68,1); animation-delay: .38s; }
    #k-arm-up { animation-duration: .52s; animation-timing-function: cubic-bezier(.16,1,.30,1); animation-delay: .62s; }
    #k-arm-dn { animation-duration: .52s; animation-timing-function: cubic-bezier(.16,1,.30,1); animation-delay: .72s; }

    #s-move { transform: translate(52px, 0px)   scale(1); animation: move-s .8s cubic-bezier(.76,0,.24,1) 1.28s both; }
    #k-move { transform: translate(1534px, 0px) scale(1); animation: move-k .8s cubic-bezier(.76,0,.24,1) 1.28s both; }
    @keyframes move-s {
      from { transform: translate(659px, -35.2px) scale(1.2); }
      to   { transform: translate(52px, 0px) scale(1); }
    }
    @keyframes move-k {
      from { transform: translate(896.6px, -35.2px) scale(1.2); }
      to   { transform: translate(1534px, 0px) scale(1); }
    }

    .mid { animation-duration: .42s; animation-timing-function: cubic-bezier(.33,1,.68,1); }

    #l-N  { --d: 1.98s; }
    #l-I1 { --d: 2.08s; }  #l-S2 { --d: 2.08s; }
    #l-E1 { --d: 2.18s; }  #l-I2 { --d: 2.18s; }
    #l-T  { --d: 2.28s; }  #l-E2 { --d: 2.28s; }

    .o1 { animation-delay: var(--d); }
    .o2 { animation-delay: calc(var(--d) +  50ms); }
    .o3 { animation-delay: calc(var(--d) + 100ms); }
    .o4 { animation-delay: calc(var(--d) + 150ms); }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; animation-delay: 0s !important; }
    }
  </style>

  <g aria-hidden="true">
    <g id="l-T" transform="translate(254 0)">
      <path class="stroke struct draw mid o1" pathLength="1" d="M 75 80 L 75 272"/>
      <path class="stroke struct draw mid o2" pathLength="1" d="M 40 80 L 110 80"/>
    </g>
    <g id="l-E1" transform="translate(448 0)">
      <path class="stroke struct draw mid o1" pathLength="1" d="M 28 80 L 28 272"/>
      <path class="stroke struct draw mid o2" pathLength="1" d="M 28 80 L 112 80"/>
      <path class="stroke struct draw mid o3" pathLength="1" d="M 28 176 L 98 176"/>
      <path class="stroke struct draw mid o4" pathLength="1" d="M 28 272 L 112 272"/>
    </g>
    <g id="l-I1" transform="translate(654 0)">
      <path class="stroke struct draw mid o1" pathLength="1" d="M 28 80 L 28 272"/>
    </g>
    <g id="l-N" transform="translate(776 0)">
      <path class="stroke struct   draw mid o1" pathLength="1" d="M 28 80 L 28 272"/>
      <path class="stroke diagonal draw mid o2" pathLength="1" d="M 28 80 L 132 272"/>
      <path class="stroke struct   draw mid o3" pathLength="1" d="M 132 80 L 132 272"/>
    </g>
    <g id="l-S2" transform="translate(992 0)">
      <path class="stroke struct draw mid o1" pathLength="1" d="M 130 125 A 51 51 0 1 0 79 176"/>
      <path class="stroke struct draw mid o2" pathLength="1" d="M 130 125 A 51 51 0 1 0 79 176" transform="rotate(180 79 176)"/>
    </g>
    <g id="l-I2" transform="translate(1216 0)">
      <path class="stroke struct draw mid o1" pathLength="1" d="M 28 80 L 28 272"/>
    </g>
    <g id="l-E2" transform="translate(1338 0)">
      <path class="stroke struct draw mid o1" pathLength="1" d="M 28 80 L 28 272"/>
      <path class="stroke struct draw mid o2" pathLength="1" d="M 28 80 L 112 80"/>
      <path class="stroke struct draw mid o3" pathLength="1" d="M 28 176 L 98 176"/>
      <path class="stroke struct draw mid o4" pathLength="1" d="M 28 272 L 112 272"/>
    </g>
  </g>

  <g id="s-move" aria-hidden="true">
    <path id="s-top" class="stroke struct draw" pathLength="1" d="M 130 125 A 51 51 0 1 0 79 176"/>
    <path id="s-bot" class="stroke struct draw" pathLength="1" d="M 130 125 A 51 51 0 1 0 79 176" transform="rotate(180 79 176)"/>
  </g>

  <g id="k-move" aria-hidden="true">
    <path id="k-stem"   class="stroke struct   draw" pathLength="1" d="M 28 80 L 28 272"/>
    <path id="k-arm-up" class="stroke diagonal draw" pathLength="1" d="M 37 176 L 124 74"/>
    <path id="k-arm-dn" class="stroke diagonal draw" pathLength="1" d="M 37 176 L 124 278"/>
  </g>
</svg>
